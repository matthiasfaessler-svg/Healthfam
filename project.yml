name: HealthFam
options:
  bundleIdPrefix: com.healthfam
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Eigene Team-ID hier eintragen (oder in Xcode unter Signing & Capabilities wählen)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  HealthFamCore:
    path: Packages/HealthFamCore

targets:
  HealthFam:
    type: application
    platform: iOS
    sources:
      - App/iOS
      - App/Shared
    dependencies:
      - package: HealthFamCore
      - target: HealthFamWatch
      - sdk: HealthKit.framework
    entitlements:
      path: App/iOS/HealthFam.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: HealthFam
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        UIBackgroundModes:
          - processing
        NSHealthShareUsageDescription: HealthFam liest Herzfrequenz, HRV, Ruhepuls, Atemfrequenz, Schlaf, Trainings, Aktivität und Ernährung aus Apple Health, um deine Recovery-, Strain-, Schlaf- und Stress-Werte zu berechnen.
        NSHealthUpdateUsageDescription: HealthFam speichert Mahlzeiten, Wasser, Achtsamkeitsminuten und Trainings in Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthfam.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  HealthFamWatch:
    type: application
    platform: watchOS
    sources:
      - App/Watch
      - App/Shared
    dependencies:
      - package: HealthFamCore
      - sdk: HealthKit.framework
    entitlements:
      path: App/Watch/HealthFamWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: HealthFam
        CFBundleDevelopmentRegion: de
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.healthfam.app
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: HealthFam liest Herzfrequenz, HRV und Schlaf, um deine Werte direkt auf der Apple Watch anzuzeigen.
        NSHealthUpdateUsageDescription: HealthFam speichert Trainings, die du auf der Apple Watch aufzeichnest, in Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthfam.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  HealthFam:
    build:
      targets:
        HealthFam: all
        HealthFamWatch: all
    run:
      config: Debug
    archive:
      config: Release
  HealthFamWatch:
    build:
      targets:
        HealthFamWatch: all
    run:
      config: Debug
